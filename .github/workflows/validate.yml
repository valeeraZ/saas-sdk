name: SDK validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Record toolchain
        run: |
          npm install --global npm@11.6.1
          mkdir -p artifacts
          node --version | tee artifacts/toolchain.log
          npm --version | tee -a artifacts/toolchain.log
          python --version | tee -a artifacts/toolchain.log
      - name: Clean installation
        run: npm ci --no-audit --no-fund 2>&1 | tee artifacts/clean-install.log
      - name: Tests, types, examples, packages, HTTP and Portal consumers
        run: npm run verify 2>&1 | tee artifacts/verification.log
      - name: Build and consume Python wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir artifacts packages/fastapi-auth-sdk 2>&1 | tee artifacts/wheel-build.log
          npm run test:wheel 2>&1 | tee artifacts/wheel-validation.log
      - name: Artifact checksums
        run: node scripts/artifact-report.mjs
      - name: Preserve packages and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-validation-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
