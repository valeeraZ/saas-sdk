[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "saas-fastapi-auth"
version = "0.1.0"
description = "SAAS DSP/Auth Service middleware for FastAPI and ASGI applications"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/saas_fastapi_auth"]
